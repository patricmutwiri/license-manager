spring.datasource.url=jdbc:h2:mem:license_manager_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
license.seed.enabled=false
license.email.enabled=false
license.admin.api-key=test-admin-key
license.offline.private-key-base64=
license.offline.public-key-base64=

# Mail configuration (disabled for tests)
spring.mail.host=localhost
spring.mail.port=1025

# OAuth2 disabled for tests
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
